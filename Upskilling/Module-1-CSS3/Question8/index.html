<!DOCTYPE html>
<html>
<head>
    <title>Box Model & Layout Control</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Community Events</h1>

    <div class="eventCard">
        <h2>Tree Plantation Drive</h2>
        <p>Join us to make our city greener.</p>
    </div>

    <div class="eventCard">
        <h2>Blood Donation Camp</h2>
        <p>Donate blood and save lives.</p>
    </div>

    <form>
        <label>Name:</label><br>
        <input type="text" placeholder="Enter your name"><br><br>

        <label>Email:</label><br>
        <input type="email" placeholder="Enter your email"><br><br>
    </form>

    <h3>visibility: hidden</h3>
    <p class="hiddenBox">This text is hidden but space is reserved.</p>

    <h3>display: none</h3>
    <p class="noneBox">This text is removed completely.</p>

</body>
</html>

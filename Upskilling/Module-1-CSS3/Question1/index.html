<!DOCTYPE html>
<html>
<head>
    <title>CSS Inclusion Methods</title>

    <!-- Internal CSS -->
    <style>
        body{
            background-color: lightblue;
        }
    </style>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Inline CSS -->
    <h1 style="color:red;">Welcome to CSS</h1>

    <h2>Learning CSS Types</h2>

    <p>This paragraph uses external CSS.</p>

</body>
</html>

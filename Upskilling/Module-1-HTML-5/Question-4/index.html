<!DOCTYPE html>
<html>
<head>
    <title>Community Events Gallery</title>

    <style>
        .event-img {
            border: 3px solid #333;
            width: 200px;
            height: 150px;
        }

        table {
            margin: 20px auto;
            border-collapse: collapse;
        }

        td {
            padding: 10px;
            text-align: center;
        }

        figcaption {
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>

<body>

<h2 style="text-align:center;">Past Community Events Gallery</h2>

<table border="1">

    <tr>
        <td>
            <figure>
                <img src="images/event1.png" alt="Tree Plantation Drive" title="Tree Plantation Drive"
                     class="event-img">
                <figcaption>Tree Plantation Drive</figcaption>
            </figure>
        </td>

        <td>
            <figure>
                <img src="images/event2.png" alt="Blood Donation Camp" title="Blood Donation Camp"
                     class="event-img">
                <figcaption>Blood Donation Camp</figcaption>
            </figure>
        </td>

        <td>
            <figure>
                <img src="images/event3.png" alt="Cleanliness Drive" title="Cleanliness Drive"
                     class="event-img">
                <figcaption>Cleanliness Drive</figcaption>
            </figure>
        </td>
    </tr>

    <tr>
        <td>
            <figure>
                <img src="images/event4.png" alt="Community Food Drive" title="Community Food Drive"
                     class="event-img">
                <figcaption>Community Food Drive</figcaption>
            </figure>
        </td>

        <td>
            <figure>
                <img src="images/event5.png" alt="Health Awareness Camp" title="Health Awareness Camp"
                     class="event-img">
                <figcaption>Health Awareness Camp</figcaption>
            </figure>
        </td>

        <td>
            <figure>
                <img src="images/event6.png" alt="Education Workshop" title="Education Workshop"
                     class="event-img">
                <figcaption>Education Workshop</figcaption>
            </figure>
        </td>
    </tr>

</table>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Save User Preferences</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
        }

        .container{
            width: 400px;
            margin: 50px auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        select, button{
            width: 200px;
            padding: 8px;
            margin: 10px;
        }
    </style>
</head>

<body>

<div class="container">

<h2>Event Preference</h2>

<label>Select Event Type</label><br><br>

<select id="eventType">
    <option value="">Select Event</option>
    <option value="Tree Plantation">Tree Plantation</option>
    <option value="Blood Donation">Blood Donation</option>
    <option value="Health Camp">Health Camp</option>
    <option value="Education Workshop">Education Workshop</option>
</select>

<br>

<button onclick="savePreference()">Save Preference</button>

<button onclick="clearPreference()">Clear Preferences</button>

</div>

<script>

// Retrieve saved preference when page loads
window.onload = function()
{
    let event = localStorage.getItem("eventType");

    if(event)
    {
        document.getElementById("eventType").value = event;
    }
}

// Save preference
function savePreference()
{
    let event = document.getElementById("eventType").value;

    localStorage.setItem("eventType", event);

    sessionStorage.setItem("eventType", event);

    alert("Preference Saved Successfully!");
}

// Clear preference
function clearPreference()
{
    localStorage.clear();

    sessionStorage.clear();

    document.getElementById("eventType").value = "";

    alert("Preferences Cleared!");
}

</script>

</body>
</html>

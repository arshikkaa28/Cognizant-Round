<!DOCTYPE html>
<html>
<head>
    <title>Event Promo Video</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f2f2f2;
        }

        .container{
            width: 600px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        #message{
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

<h2>Community Event Promo Video</h2>

<video width="500" controls oncanplay="videoReady()">
    <source src="event.mp4" type="video/mp4">
    Your browser does not support the video tag.
</video>

<p id="message"></p>

</div>

<script>

function videoReady()
{
    document.getElementById("message").innerHTML =
    "Video ready to play";
}

window.onbeforeunload = function()
{
    return "Your form is not completed. Are you sure you want to leave?";
}

</script>

</body>
</html>
